# HTTP Server Block - Always active, handles ACME challenge & HTTP traffic/redirects
server {
    listen 80 default_server;
    server_name app.tracelytag.com _;

    client_max_body_size 50M;

    # ACME Challenge location for Certbot validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect to HTTPS if SSL certificates exist
    location / {
        if (-f /etc/letsencrypt/live/app.tracelytag.com/fullchain.pem) {
            return 301 https://$host$request_uri;
        }
        root /app/artifacts/traclytag/dist;
        try_files $uri $uri/ /index.html;
    }

    # Fallback HTTP API proxy if SSL is not active yet
    location /api {
        if (-f /etc/letsencrypt/live/app.tracelytag.com/fullchain.pem) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS Server Block - Included via nginx.conf if certificate exists
server {
    listen 443 ssl;
    http2 on;
    server_name app.tracelytag.com;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/app.tracelytag.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tracelytag.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ACME Challenge location on HTTPS (for safety)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Serve static frontend built files
    location / {
        root /app/artifacts/traclytag/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Express backend running on port 3000
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
