# Host Nginx configuration for Ubuntu VPS (51.79.160.129 / app.tracelytag.com / app.tracelytag.com)
# Copy this file to /etc/nginx/sites-available/app.tracelytag.com on your VPS
# then run: sudo ln -s /etc/nginx/sites-available/app.tracelytag.com /etc/nginx/sites-enabled/
# and test with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name app.tracelytag.com app.tracelytag.com 51.79.160.129;

    client_max_body_size 50M;

    # Proxy frontend requests to Docker container on port 80
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to Docker container on port 3000
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
