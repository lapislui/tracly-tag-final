<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>TraclyTag Admin</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Check if device is mobile/tablet or runs mobile emulator user-agent
        const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                              (window.matchMedia("(max-width: 1024px)").matches && ('ontouchstart' in window || navigator.maxTouchPoints > 0));
        
        if (isMobileDevice) {
          return; // Skip all DevTools/Inspect restrictions on mobile
        }

        // 1. Disable right-click context menu
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Disable developer shortcut keys
        document.addEventListener('keydown', event => {
          if (
            event.key === 'F12' ||
            (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c' || event.key === 'K' || event.key === 'k')) ||
            (event.ctrlKey && (event.key === 'U' || event.key === 'u' || event.key === 'S' || event.key === 's' || event.key === 'H' || event.key === 'h'))
          ) {
            event.preventDefault();
            return false;
          }
        });

        // 3. Disable and clear console methods, keeping original references for checks
        const originalLog = window.console ? window.console.log : null;
        const originalClear = window.console ? window.console.clear : null;
        const noop = () => {};

        if (window.console) {
          const consoleMethods = ['log', 'info', 'warn', 'error', 'debug', 'clear', 'dir', 'table', 'trace', 'group', 'groupCollapsed', 'groupEnd'];
          consoleMethods.forEach(method => {
            if (window.console[method]) {
              window.console[method] = noop;
            }
          });
          // Periodically clear console to remove any leaked logs
          setInterval(() => {
            try {
              window.console.clear();
            } catch(e) {}
          }, 1000);
        }

        // 4. Advanced DevTools Detector (Non-debugger/Stealth, instantly redirects)

        // Check 2: Element ID getter formatting check (triggers when DevTools parses log)
        if (originalLog && originalClear) {
          const element = new Image();
          Object.defineProperty(element, 'id', {
            get: function() {
              window.location.replace("about:blank");
            }
          });
          setInterval(() => {
            try {
              originalLog(element);
              originalClear();
            } catch (e) {}
          }, 500);
        }

        // Check 3: RegExp toString formatting check (triggers when DevTools parses log)
        // if (originalLog && originalClear) {
        //   const regexObj = /./;
        //   regexObj.toString = function() {
        //     window.location.replace("about:blank");
        //     return '';
        //   };
        //   setInterval(() => {
        //     try {
        //       originalLog(regexObj);
        //       originalClear();
        //     } catch (e) {}
        //   }, 500);
        // }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
