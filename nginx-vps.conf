# Nginx configuration for app.tracelytag.com
# Place this file on your VPS at: /etc/nginx/sites-available/app.tracelytag.com
# Create a symlink: sudo ln -s /etc/nginx/sites-available/app.tracelytag.com /etc/nginx/sites-enabled/
# Then test & reload Nginx: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name app.tracelytag.com;

    # Increase maximum upload file size for asset uploads
    client_max_body_size 50M;

    # Frontend (Vite server on port 5173 exposed from Docker container)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Server (Port 3000 exposed from Docker container)
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
